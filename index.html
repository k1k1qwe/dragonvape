<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonVape — Жидкости и картриджи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка -->
    <header class="header">
        <div class="container header-container">
            <div class="logo">🐉 DragonVape</div>
            <div class="header-controls">
                <button class="cart-icon-btn" id="cartToggle">
                    🛒 <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Боковая панель с фильтрами -->
        <aside class="sidebar">
            <h2>Фильтры</h2>
            
            <div class="filter-group">
                <h3>По вкусу</h3>
                <ul class="category-list" id="flavorFilter">
                    <!-- Сюда подгрузятся вкусы из JS -->
                </ul>
            </div>

            <div class="filter-group">
                <h3>По бренду</h3>
                <ul class="category-list" id="brandFilter">
                    <!-- Сюда подгрузятся бренды из JS -->
                </ul>
            </div>

            <div class="filter-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="inStockOnly"> Только в наличии
                </label>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="content">
            <div class="catalog-header">
                <h1 id="categoryTitle">Все товары</h1>
                <span class="product-count" id="productCount">0 товаров</span>
            </div>
            <div class="goods-grid" id="goodsContainer">
                <!-- Сюда будут рисоваться карточки -->
            </div>
        </main>
    </div>

    <!-- Корзина (выпадающая панель) -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h2>🛒 Корзина</h2>
            <button class="close-cart" id="closeCart">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="empty-cart">Корзина пуста</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total" id="cartTotal">Итого: 0 ₽</div>
            <button class="btn-telegram" id="sendOrderBtn">📤 Отправить заказ в Telegram</button>
        </div>
    </div>

    <!-- Подложка для уведомлений -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
